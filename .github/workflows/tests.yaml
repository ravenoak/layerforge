name: Run Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Install dependencies
        run: uv sync --locked --all-groups
      - name: Ruff lint
        run: uv run ruff check
      - name: Ruff format
        run: uv run ruff format --check
      - name: Pyright
        run: uv run pyright

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --locked --all-groups
      - name: Run tests
        run: uv run pytest -q

  specs:
    runs-on: ubuntu-latest
    env:
      # To bump: set the version and the SHA-256 of the linux tarball from
      # https://github.com/juxt/allium-tools/releases (SHA256SUMS.txt omits it).
      ALLIUM_VERSION: '3.6.1'
      ALLIUM_SHA256: e00c99ae234b10207719257a70e7c2dcad73060864468cd293fb7ad40524e970
    steps:
      - uses: actions/checkout@v7
      - name: Install allium
        run: |
          file=allium-x86_64-unknown-linux-gnu.tar.gz
          curl -fsSLO "https://github.com/juxt/allium-tools/releases/download/v${ALLIUM_VERSION}/${file}"
          echo "${ALLIUM_SHA256}  ${file}" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar -xzf "$file" -C "$HOME/.local/bin" allium
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Check specs
        run: ./scripts/check_specs.sh
