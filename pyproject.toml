[project]
name = "layerforge"
version = "0.1.0"
description = "A 3D Model Slicing and SVG Generation Application"
readme = "README.md"
requires-python = ">=3.12"
license = "CC-BY-NC-4.0"
license-files = ["LICENSE", "COMMERCIAL_LICENSE"]
authors = [{ name = "Caitlyn O'Hanna", email = "caitlyn.ohanna@gmail.com" }]
dependencies = [
    "click>=8.3",
    "networkx>=3.7",
    "pydantic>=2.12",
    "scipy>=1.18.1",
    "shapely>=2.1",
    "svgwrite>=1.4.3",
    "trimesh>=5.1",
]

[project.scripts]
layerforge = "layerforge.cli:cli"

[dependency-groups]
dev = [
    "hypothesis>=6.140",
    "pytest>=9.0",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-click",
    "mkdocs-gen-files",
    "mkdocs-include-markdown-plugin",
    "mkdocs-literate-nav",
    "mkdocs-material",
    "mkdocs-section-index",
    "mkdocstrings-python",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
