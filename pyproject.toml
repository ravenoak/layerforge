[project]
name = "layerforge"
version = "0.1.0"
description = "A 3D Model Slicing and SVG Generation Application"
readme = "README.md"
requires-python = ">=3.12"
license = "CC-BY-NC-4.0"
license-files = ["LICENSE", "COMMERCIAL_LICENSE"]
authors = [{ name = "Caitlyn O'Hanna", email = "caitlyn.ohanna@gmail.com" }]
dependencies = [
    "click>=8.3",
    "networkx>=3.7",
    "pydantic>=2.12",
    "scipy>=1.18.1",
    "shapely>=2.1",
    "svgwrite>=1.4.3",
    "trimesh>=5.1",
]

[project.scripts]
layerforge = "layerforge.cli:cli"

[dependency-groups]
dev = [
    "hypothesis>=6.140",
    "pyright>=1.1.414",
    "pytest>=9.0",
    "ruff>=0.16.8",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-click",
    "mkdocs-gen-files",
    "mkdocs-include-markdown-plugin",
    "mkdocs-literate-nav",
    "mkdocs-material",
    "mkdocs-section-index",
    "mkdocstrings-python",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
src = ["src", "tests"]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pyright]
include = ["src", "tests", "scripts"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[[tool.pyright.executionEnvironments]]
root = "src"
typeCheckingMode = "strict"

[[tool.pyright.executionEnvironments]]
root = "."
extraPaths = ["src"]
